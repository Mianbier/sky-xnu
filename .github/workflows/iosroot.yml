name: iosroot

# Build the iOS root filesystem image for sky.
#
# This has to run on Linux: reading the IPSW's APFS images needs apfs-fuse (a
# FUSE filesystem) and writing the case-sensitive journaled HFS+ volume needs
# hfsprogs. Neither exists for Windows, which is the only host the developer
# has.
#
# The output is a single HFS+ image that goes on the phone's userdata partition
# (the kernel reaches "Waiting on IOMedia Apple_HFS" and needs a root).
#
# Delivery: the compressed image is ~2-4 GB, which is over the artifact quota,
# so it is published as release assets split at 1.9 GB (GitHub allows 2 GB per
# asset and does not count release storage against the Actions quota).

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: IPSW to take the root filesystem from
        default: "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
      size:
        description: HFS+ volume size
        default: "12G"
      publish:
        description: "true = upload release assets, false = build only"
        default: "true"

concurrency:
  group: iosroot-${{ github.ref }}
  cancel-in-progress: true

# gh release upload needs write access to the repo's releases.
permissions:
  contents: write

env:
  WORK: /mnt/iosroot            # the runner's large scratch disk
  OS_DMG: 087-86698-044.dmg     # OS               4.7 GB  root filesystem
  SYS_DMG: 087-86593-047.dmg    # Cryptex1,SystemOS 2.7 GB
  APP_DMG: 087-86715-047.dmg    # Cryptex1,AppOS    10 MB

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # apfs-fuse is not in Ubuntu 24.04's archive and hfsprogs may not be
      # either, so install what exists, then build what does not. Everything
      # here is only needed to read the IPSW's APFS images and to write a
      # case-sensitive journaled HFS+ volume.
      - name: Tooling
        run: |
          set -x
          sudo apt-get update -qq
          for p in rsync zstd curl cmake g++ git libfuse3-dev libbz2-dev \
                   zlib1g-dev libssl-dev libattr1-dev pkg-config hfsprogs; do
            if sudo apt-get install -y -qq "$p" >/dev/null 2>&1; then
              echo "OK   $p"
            else
              echo "MISS $p"
            fi
          done
          # /mnt exists but belongs to root on the runner image; /mnt and / are
          # the same filesystem here, so this keeps the 80+ GB free space usable.
          sudo mkdir -p "$WORK"
          sudo chown -R "$(id -u):$(id -g)" "$WORK"
          touch "$WORK/.writable" && echo "WORK is writable"
          df -h /mnt /

          if ! command -v apfs-fuse >/dev/null; then
            echo "--- building apfs-fuse from source ---"
            git clone -q --depth 1 https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
            git -C /tmp/apfs-fuse submodule update --init --recursive --depth 1
            cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build -DCMAKE_BUILD_TYPE=Release >/dev/null
            cmake --build /tmp/apfs-fuse/build -j"$(nproc)" >/dev/null
            sudo install -m 0755 /tmp/apfs-fuse/build/apfs-fuse /usr/local/bin/
          fi

          # hfsplus is a module in the runner kernel; without it the HFS+ image
          # can be created but not mounted, so the root cannot be populated.
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || true
          sudo modprobe hfsplus 2>/dev/null || true
          echo "--- hfsplus availability ---"
          grep -w hfsplus /proc/filesystems || echo "hfsplus NOT in /proc/filesystems"

          echo "--- capability check ---"
          for t in apfs-fuse mkfs.hfsplus fsck.hfsplus rsync zstd curl; do
            printf '%-16s ' "$t"
            command -v "$t" || echo MISSING
          done

      # Download the whole IPSW and unzip the three members we need: simpler and
      # more robust than parsing the zip64 central directory and issuing ~900
      # range requests, and the archive is smaller than its members anyway.
      - name: Fetch the IPSW
        run: |
          set -eux
          mkdir -p "$WORK/ipsw"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
               -o "$WORK/ios.ipsw" "${{ inputs.ipsw_url }}"
          ls -la "$WORK/ios.ipsw"
          df -h /mnt
          unzip -o "$WORK/ios.ipsw" "$OS_DMG" "$SYS_DMG" "$APP_DMG" -d "$WORK/ipsw"
          ls -la "$WORK/ipsw"
          rm -f "$WORK/ios.ipsw"
          df -h /mnt

      - name: Build the HFS+ root
        run: |
          sudo -E bash ci/iosroot/mkiosroot.sh \
            "$WORK/ipsw/$OS_DMG" "$WORK/ipsw/$SYS_DMG" "$WORK/ipsw/$APP_DMG" \
            "$WORK/sky-iosroot.img" "${{ inputs.size }}"
          ls -la "$WORK"/sky-iosroot.img
          df -h /mnt

      # Uncompressed content plus the IPSW will not both fit, and we no longer
      # need the DMGs once the image exists.
      - name: Drop the sources
        if: always()
        run: rm -rf "$WORK/ipsw" && df -h /mnt

      - name: Compress
        run: |
          cd "$WORK"
          zstd -T0 -3 --long=27 sky-iosroot.img -o sky-iosroot.img.zst
          ls -la sky-iosroot.img.zst
          sha256sum sky-iosroot.img sky-iosroot.img.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Split for release assets (2 GB limit each)
        run: |
          cd "$WORK"
          split -b 1900M -d sky-iosroot.img.zst sky-iosroot.img.zst.part
          ls -la sky-iosroot.img.zst.part* | head -20
          du -sh sky-iosroot.img.zst.part* 2>/dev/null | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iosroot-sums
          path: |
            /mnt/iosroot/SHA256SUMS
          if-no-files-found: warn

      - name: Publish release assets
        if: inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="iosroot-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" --title "sky iOS root $tag" \
            --notes "HFS+ root filesystem image built from ${{ inputs.ipsw_url }} for sky (Redmi Note 12R). Concatenate the parts with: cat sky-iosroot.img.zst.part* | zstd -d > sky-iosroot.img" \
            || gh release create "$tag" --title "sky iOS root $tag"
          for f in "$WORK"/sky-iosroot.img.zst.part*; do
            gh release upload "$tag" "$f" --clobber
          done
          gh release view "$tag"
